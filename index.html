<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Español en 6 meses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #faf7f2;
  --surface: #ffffff;
  --surface-2: #f3eee6;
  --text: #1f1b16;
  --muted: #6b6359;
  --border: #e6dfd4;
  --accent: #c8102e;      /* vermelho da bandeira */
  --accent-2: #f1bf00;    /* amarelo da bandeira */
  --accent-soft: #fbe7ea;
  --ok: #2e7d4f;
  --ok-soft: #e3f3e9;
  --warn: #b26a00;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f;
    --surface: #1f1c17;
    --surface-2: #29251f;
    --text: #f2ede6;
    --muted: #a69d90;
    --border: #3a342c;
    --accent: #ff4d63;
    --accent-2: #ffd23f;
    --accent-soft: #3a1c21;
    --ok: #5cc98a;
    --ok-soft: #1c3226;
    --warn: #f0a640;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #15130f;
    --surface: #1f1c17;
    --surface-2: #29251f;
    --text: #f2ede6;
    --muted: #a69d90;
    --border: #3a342c;
    --accent: #ff4d63;
    --accent-2: #ffd23f;
    --accent-soft: #3a1c21;
    --ok: #5cc98a;
    --ok-soft: #1c3226;
    --warn: #f0a640;
    --shadow: none;
    color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  font-size: 16px;
}
a { color: var(--accent); }

/* Topo */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand { font-weight: 700; text-decoration: none; color: var(--text); white-space: nowrap; }
nav { display: flex; gap: 2px; overflow-x: auto; }
nav a {
  padding: 8px 12px; border-radius: 10px; text-decoration: none;
  color: var(--muted); font-weight: 500; font-size: 15px; white-space: nowrap;
}
nav a.active, nav a:hover { background: var(--surface-2); color: var(--text); }
@media (max-width: 640px) {
  .brand span { display: none; }
  nav a { padding: 8px 9px; font-size: 14px; }
}

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
main {
  max-width: 820px; margin: 0 auto; padding-block: 24px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
h2 { font-size: 20px; margin: 28px 0 10px; }
h3 { font-size: 17px; margin: 0 0 6px; }
.sub { color: var(--muted); margin: 0 0 20px; }
.small { font-size: 14px; color: var(--muted); }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
}

/* Botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
  text-decoration: none;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.rec { background: var(--accent); color: #fff; border-color: var(--accent); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .65; } }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }

/* Hoje: blocos */
.hero {
  display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;
  background: linear-gradient(120deg, var(--accent-soft), var(--surface));
}
.ring { width: 84px; height: 84px; }
.ring circle { fill: none; stroke-width: 9; }
.ring .bg { stroke: var(--border); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s; }
.ring text { font-weight: 700; font-size: 20px; fill: var(--text); }

.block {
  display: flex; gap: 14px; align-items: center;
  text-decoration: none; color: inherit;
}
.block .icon {
  width: 46px; height: 46px; flex: none; border-radius: 12px;
  display: grid; place-items: center; font-size: 22px;
  background: var(--surface-2);
}
.block.done .icon { background: var(--ok-soft); }
.block .info { flex: 1; min-width: 0; }
.block .min { font-size: 14px; color: var(--muted); white-space: nowrap; }
.block.done h3::after { content: " ✓"; color: var(--ok); }
a.card.block:hover { border-color: var(--accent); }

/* Timer */
.timer {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; border-radius: 12px; background: var(--surface-2); margin-bottom: 18px;
}
.timer .clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 22px; min-width: 70px; }

/* Flashcards */
.flash { text-align: center; padding: 28px 18px; }
.flash .pt { font-size: 24px; font-weight: 600; margin: 8px 0 18px; }
.flash .es { font-size: 26px; font-weight: 700; color: var(--accent); margin: 14px 0 6px; }
.flash .note { color: var(--muted); font-size: 15px; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.tag.new { background: var(--accent-soft); color: var(--accent); }
.heard { margin: 12px auto 0; max-width: 520px; padding: 10px 14px; border-radius: 10px; background: var(--surface-2); font-size: 15px; }
.heard .score { font-weight: 700; }
.w-ok { color: var(--ok); font-weight: 600; }
.w-miss { color: var(--accent); text-decoration: underline wavy; font-weight: 600; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 20px; }
.grades .btn { flex-direction: column; gap: 0; padding: 10px 6px; }
.grades .btn small { font-weight: 400; color: var(--muted); font-size: 12px; }
.g1 { border-color: var(--accent) !important; }
.g4 { border-color: var(--ok) !important; }

/* Shadowing */
.phrase { display: flex; flex-direction: column; gap: 8px; }
.phrase .es-big { font-size: 20px; font-weight: 600; }
.phrase .pt-small { color: var(--muted); font-size: 14px; }

/* Lição */
.lesson ul { padding-left: 20px; }
.lesson li { margin-bottom: 6px; }
.vocab { width: 100%; border-collapse: collapse; font-size: 15px; }
.vocab td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
.vocab td:first-child { color: var(--muted); width: 45%; }
.challenge { border-left: 4px solid var(--accent-2); }

/* Escrita */
textarea, input[type=text], input[type=date], input[type=number], select {
  width: 100%; font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; padding: 12px;
}
textarea { min-height: 180px; resize: vertical; }
textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 6px; }

/* Trilha */
.phase-title { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 10px; }
.phase-title span { color: var(--muted); font-size: 14px; }
.week {
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  padding: 12px 14px; margin-bottom: 8px;
}
.week .num {
  width: 34px; height: 34px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-weight: 700; font-size: 14px;
  background: var(--surface-2); color: var(--muted);
}
.week.current { border-color: var(--accent); }
.week.current .num { background: var(--accent); color: #fff; }
.week.done .num { background: var(--ok); color: #fff; }
.week.locked { opacity: .55; }

/* Progresso */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat .v { font-size: 28px; font-weight: 700; }
.stat .l { font-size: 14px; color: var(--muted); }
.heat { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.heat div { aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); }
.heat .l1 { background: color-mix(in srgb, var(--ok) 35%, var(--surface-2)); }
.heat .l2 { background: color-mix(in srgb, var(--ok) 65%, var(--surface-2)); }
.heat .l3 { background: var(--ok); }
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 99px; }

.res { display: block; text-decoration: none; color: inherit; }
.res:hover { border-color: var(--accent); }
.res b { color: var(--accent); }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px;
  opacity: 0; pointer-events: none; transition: .25s; font-weight: 500; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.empty { text-align: center; padding: 40px 18px; }
.empty .big { font-size: 44px; }
.warnbox { background: var(--accent-soft); border-color: transparent; }

/* Responder digitando/ditando */
.typed { display: flex; gap: 8px; max-width: 520px; margin: 0 auto 12px; }
.typed input { flex: 1; min-width: 0; }
.flash .typed { margin-top: -4px; }
.phrase .typed { margin: 4px 0 0; max-width: none; }
.btn:focus-visible, nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>
<body>
  <header class="top">
    <a class="brand" href="#hoje">🇪🇸 <span>Español en 6 meses</span></a>
    <nav id="nav">
      <a href="#hoje">Hoje</a>
      <a href="#trilha">Trilha</a>
      <a href="#revisar">Cartões</a>
      <a href="#falar">Falar</a>
      <a href="#progresso">Progresso</a>
      <a href="#config">⚙</a>
    </nav>
  </header>
  <main id="app"></main>
  <div id="toast" class="toast"></div>

  <script>
// Conteúdo do curso: 24 semanas (6 meses), foco em FALAR sem portunhol,
// espanhol da Espanha e vocabulário de audiovisual / mercado de trabalho.

const PHASES = [
  { n: 1, name: "Base sem portunhol", weeks: [1, 4] },
  { n: 2, name: "Falar do dia a dia e do passado", weeks: [5, 10] },
  { n: 3, name: "Espanhol do audiovisual", weeks: [11, 16] },
  { n: 4, name: "Mercado de trabalho", weeks: [17, 22] },
  { n: 5, name: "Vida na Espanha e simulado", weeks: [23, 24] },
];

// Recursos de input (ouvir/ler) por fase. Todos gratuitos (alguns com parte paga opcional).
const INPUT = {
  1: [
    { name: "Dreaming Spanish (nível Intermediate)", url: "https://www.dreamingspanish.com", tip: "Filtre por guias da Espanha. Assista sem legenda." },
    { name: "Hoy Hablamos (podcast)", url: "https://www.hoyhablamos.com", tip: "Podcast diário feito na Espanha, ~10 min por episódio." },
    { name: "Easy Spanish (YouTube)", url: "https://www.youtube.com/@EasySpanish", tip: "Entrevistas na rua. Prefira os episódios gravados na Espanha." },
  ],
  2: [
    { name: "Dreaming Spanish (Intermediate/Advanced)", url: "https://www.dreamingspanish.com", tip: "Continue somando horas. Meta: 30 min/dia." },
    { name: "RTVE Play", url: "https://www.rtve.es/play/", tip: "TV pública espanhola, grátis. Séries, documentários e telejornal." },
    { name: "Hoy Hablamos", url: "https://www.hoyhablamos.com", tip: "Ouça e depois resuma em voz alta o que entendeu (1 min)." },
  ],
  3: [
    { name: "RTVE Play: documentários e séries", url: "https://www.rtve.es/play/", tip: "Repare em como falam de rodaje, montaje, plano..." },
    { name: "YouTube: tutoriais de edição em espanhol", url: "https://www.youtube.com/results?search_query=tutorial+davinci+resolve+espa%C3%B1ol+edici%C3%B3n", tip: "Aprenda o vocabulário técnico assistindo ao que você já sabe fazer." },
    { name: "Academia de Cine (YouTube)", url: "https://www.youtube.com/@academiadecine", tip: "Entrevistas e masterclasses do cinema espanhol." },
  ],
  4: [
    { name: "YouTube: entrevista de trabajo en España", url: "https://www.youtube.com/results?search_query=entrevista+de+trabajo+consejos+espa%C3%B1a", tip: "Anote perguntas comuns e responda em voz alta." },
    { name: "InfoJobs: vagas de editor de vídeo", url: "https://www.infojobs.net/ofertas-trabajo/editor-de-video", tip: "Leia 3 vagas por dia e anote as palavras que se repetem." },
    { name: "RTVE Play / podcasts nativos", url: "https://www.rtve.es/play/", tip: "Mantenha 20 min de input natural por dia." },
  ],
  5: [
    { name: "YouTube: trámites al llegar a España", url: "https://www.youtube.com/results?search_query=tr%C3%A1mites+llegar+a+espa%C3%B1a+NIE+empadronamiento", tip: "NIE, empadronamiento, aluguel, banco." },
    { name: "RTVE Play: telejornal", url: "https://www.rtve.es/play/", tip: "Assista o telejornal e resuma 3 notícias em voz alta." },
    { name: "Hoy Hablamos", url: "https://www.hoyhablamos.com", tip: "Velocidade nativa: tente entender sem pausar." },
  ],
};

const WEEKS = [
  {
    n: 1, title: "Sons da Espanha",
    lesson: `
<p>Seu ouvido já entende. Agora a boca precisa largar os hábitos do português. Os 5 sons que mais denunciam o portunhol:</p>
<ul>
<li><b>Z e C (antes de E/I)</b>: na Espanha soam como o <i>th</i> do inglês "think". <i>cero, ciudad, hacer, zapato</i>.</li>
<li><b>J e G (antes de E/I)</b>: som raspado, de garganta, mais forte que o nosso R de "carro". <i>trabajo, gente, jefe</i>.</li>
<li><b>LL e Y</b>: soam como um "i" forte, nunca como "lh". <i>lluvia</i> ≈ "iúvia", <i>calle</i> ≈ "caie".</li>
<li><b>Vogais finais</b>: E final é E mesmo, O final é O mesmo. <i>leche</i> (não "lechi"), <i>trabajo</i> (não "trabaju").</li>
<li><b>Sem nasal</b>: <i>son, bien, también</i> sem o "ão/ẽ" do português. Feche o N na ponta da língua.</li>
</ul>
<p><b>Truque:</b> grave a si mesma lendo os cartões e compare com o áudio. Você vai ouvir os erros na hora.</p>`,
    speak: "Grave 1 minuto se apresentando: quem você é, de onde é, o que faz. Ouça a gravação e marque cada 'chi' ou 'u' no final de palavra.",
    write: ["Preséntate: quién eres, de dónde eres y a qué te dedicas (5 frases).", "Describe tu ciudad en 5 frases."],
  },
  {
    n: 2, title: "Falsos amigos",
    lesson: `
<p>Palavras iguais com sentido diferente. São a maior fonte de mal-entendido (e de vergonha).</p>
<ul>
<li><b>embarazada</b> = grávida (envergonhada = <i>avergonzada</i>)</li>
<li><b>exquisito</b> = delicioso (esquisito = <i>raro</i>)</li>
<li><b>oficina</b> = escritório (oficina mecânica = <i>taller</i>)</li>
<li><b>apellido</b> = sobrenome (apelido = <i>apodo</i>)</li>
<li><b>pronto</b> = cedo/logo (pronto = <i>listo</i>)</li>
<li><b>borracha</b> = bêbada (borracha de apagar = <i>goma</i>)</li>
<li><b>polvo</b> = pó (polvo animal = <i>pulpo</i>)</li>
<li><b>rato</b> = momento (rato = <i>ratón</i>)</li>
<li><b>largo</b> = comprido (largo = <i>ancho</i>)</li>
<li><b>salada</b> = salgada (salada = <i>ensalada</i>)</li>
</ul>`,
    speak: "Conte em voz alta uma história curta (pode ser inventada) usando pelo menos 4 falsos amigos corretamente.",
    write: ["Escribe 6 frases usando: oficina, listo, raro, apellido, pronto, rato.", "Cuenta qué hiciste el fin de semana (5 frases, como puedas)."],
  },
  {
    n: 3, title: "Artigos, gênero e o famoso 'hay'",
    lesson: `
<ul>
<li><b>Não existe "no/na/num"</b>: use <i>en el, en la, en un</i>. "Estou no escritório" = <i>Estoy en la oficina</i>.</li>
<li><b>a + el = al</b>, <b>de + el = del</b>. Só esses dois se juntam.</li>
<li><b>"Tem" (existir) = HAY</b>. "Tem um problema" = <i>Hay un problema</i>. Nunca "tiene un problema" nesse sentido.</li>
<li><b>Gênero trocado</b>: <i>la leche, la sal, la nariz, la sangre, el viaje, el puente, el color, el dolor, el equipo, el árbol</i>.</li>
<li><b>Palavras em -aje são masculinas</b>: <i>el montaje, el viaje, el mensaje, el paisaje</i>.</li>
<li><b>LO + adjetivo</b> = "o ... (coisa)": <i>lo mejor, lo importante, lo malo</i>.</li>
</ul>`,
    speak: "Descreva em voz alta o lugar onde você trabalha usando 'hay' pelo menos 5 vezes.",
    write: ["Describe tu espacio de trabajo usando 'hay', 'en el', 'en la' (6 frases).", "¿Qué es lo mejor y lo peor de tu trabajo?"],
  },
  {
    n: 4, title: "Verbos que você usa toda hora",
    lesson: `
<ul>
<li><b>Ditongos</b>: e→ie (<i>quiero, empiezo, pienso</i>) e o→ue (<i>puedo, vuelvo, duermo</i>). Só nas formas yo/tú/él/ellos.</li>
<li><b>Irregulares no "yo"</b>: <i>hago, salgo, tengo, pongo, digo, vengo, conozco</i>.</li>
<li><b>"Eu acho que"</b> = <i>creo que / me parece que</i>. (<i>Acho</i> não existe; <i>hallar</i> = encontrar.)</li>
<li><b>"Ficar"</b> não tem tradução única:
  <ul><li>permanecer → <i>quedarse</i> (me quedo en casa)</li>
  <li>emoção → <i>ponerse</i> (me pongo nerviosa)</li>
  <li>localização → <i>estar</i> (¿dónde está?)</li>
  <li>resultado → <i>quedar</i> (ha quedado bien)</li></ul></li>
</ul>`,
    speak: "Fale 1 minuto sobre sua rotina: a que horas acorda, sai, começa a trabalhar, o que faz.",
    write: ["Describe tu rutina de un día normal (8 frases).", "¿Qué te pone nerviosa y qué te pone contenta?"],
  },
  {
    n: 5, title: "Gustar e companhia",
    lesson: `
<ul>
<li>Em espanhol, a coisa "agrada" você: <i>Me gusta el cine</i>. Nunca "yo gusto de".</li>
<li><b>Sem "de"</b>: "Gosto <s>de</s> editar" = <i>Me gusta editar</i>.</li>
<li><b>Plural</b>: <i>me gusta</i> + singular/verbo, <i>me gustan</i> + plural (<i>me gustan los documentales</i>).</li>
<li>Para concordar: <i>A mí también</i> / <i>A mí tampoco</i> (não "yo también" depois de gustar).</li>
<li>Mesma estrutura: <i>me encanta, me interesa, me molesta, me duele, me apetece</i>.</li>
<li><b>Me apetece</b> = estou a fim de (muito usado na Espanha): <i>¿Te apetece un café?</i></li>
</ul>`,
    speak: "Fale do que você gosta e não gosta no seu trabalho e no seu tempo livre (1 min). Use gusta/gustan/encanta/apetece.",
    write: ["¿Qué te gusta y qué no te gusta de editar vídeos?", "Escribe sobre tus series y películas favoritas."],
  },
  {
    n: 6, title: "Ser e estar (onde o português engana)",
    lesson: `
<ul>
<li><b>Eventos usam SER para lugar/hora</b>: <i>La reunión es en la sala 2</i>. <i>La fiesta es el sábado</i>.</li>
<li><b>Localização de coisas/pessoas = ESTAR</b>: <i>¿Dónde está la productora?</i> (= onde fica?)</li>
<li><b>Estado civil</b>: <i>está casado/soltero</i> (o mais comum na Espanha).</li>

    newPerDay: 10,

    newCount: {},       // data -> nº de cartões novos vistos

}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return Object.assign(defaultState(), JSON.parse(raw));
  } catch (e) { /* sem acesso ao armazenamento */ }
  return defaultState();
}

  S.savedAt = Date.now();

}

  try { await cloud.set({ state: JSON.stringify(S), savedAt: S.savedAt || Date.now() }); }
  catch (e) {
    if (e && e.code === "quota_exceeded") toast("Espaço da conta cheio: o progresso ficou só neste aparelho.");
  }
  cloudBusy = false;
  if (cloudDirty) { cloudDirty = false; pushCloud(); }
}
async function pullCloud() {
  if (!cloud) return;
  try {
    const snap = await cloud.get();
    if (!snap.exists) return pushCloud();
    const d = snap.data();
    if ((d.savedAt || 0) > (S.savedAt || 0)) {
      S = Object.assign(defaultState(), JSON.parse(d.state));
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      queue = [];
      render();
    } else if ((d.savedAt || 0) < (S.savedAt || 0)) pushCloud();
  } catch (e) { /* sem conexão: continua com o que está no aparelho */ }
}
async function initCloud() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    cloud = db.doc("data/users/" + id + "/progress");
    await pullCloud();
    render();
    document.addEventListener("visibilitychange", () => { if (!document.hidden) pullCloud(); });
  } catch (e) { cloud = null; }
}

/* ---------- Utilidades ---------- */
function pad(n) { return String(n).padStart(2, "0"); }
function todayKey(d = new Date()) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function $(sel) { return document.querySelector(sel); }
function todayLog() {
  const k = todayKey();
  if (!S.log[k]) S.log[k] = { blocks: {}, minutes: 0 };
  return S.log[k];
}
function weekData(n = S.week) { return WEEKS[n - 1]; }
function phaseOf(n) { return PHASES.find((p) => n >= p.weeks[0] && n <= p.weeks[1]); }
function expectedWeek() {
  const days = Math.floor((startOfToday() - new Date(S.startDate + "T00:00:00").getTime()) / DAY);
  return Math.min(24, Math.max(1, Math.floor(days / 7) + 1));
}
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- Voz: ouvir (TTS), reconhecer (STT), gravar ---------- */
let esVoice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  const es = voices.filter((v) => v.lang && v.lang.toLowerCase().startsWith("es"));
  const spain = es.filter((v) => v.lang.toLowerCase() === "es-es");
  const pool = spain.length ? spain : es;
  esVoice = pool.find((v) => /natural|online|neural/i.test(v.name)) || pool[0] || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text, rate = 1) {
  if (!("speechSynthesis" in window)) return toast("Este navegador não tem voz. Use o Chrome ou o Edge.");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "es-ES";
  if (esVoice) u.voice = esVoice;
  u.rate = rate;
  speechSynthesis.speak(u);
}

const SR = EMBED ? null : (window.SpeechRecognition || window.webkitSpeechRecognition);
const CAN_MIC = !!SR;
const CAN_REC = !EMBED && !!(navigator.mediaDevices && window.MediaRecorder);
let activeRec = null;

// Campo para responder digitando ou ditando com o microfone do teclado.
function typedHTML(id) {
  return `<div class="typed">
    <input type="text" id="${id}" autocomplete="off" autocapitalize="sentences" lang="es"
      placeholder="${CAN_MIC ? "Ou digite sua resposta aqui" : "Toque aqui e dite com o 🎤 do teclado"}">
    <button class="btn" id="${id}Go">Conferir</button>
  </div>`;
}
function bindTyped(id, target, onResult) {
  const inp = $("#" + id), go = $("#" + id + "Go");
  if (!inp) return;
  const run = () => { if (inp.value.trim()) onResult(bestCompare(target, [inp.value])); };
  go.onclick = run;
  inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); run(); } };
}
function recordHTML(btnId, audioId, label = "⏺ Gravar") {
  if (CAN_REC) return `<button class="btn" id="${btnId}">${label}</button><audio id="${audioId}" controls hidden></audio>`;
  return `<span class="small">Para se ouvir, grave com o gravador de voz do celular.</span>`;
}
function bindRecord(btnId, audioId) {
  const b = $("#" + btnId);
  if (b) b.onclick = () => toggleRecord(b, $("#" + audioId));
}
function listen(onText, onEnd) {
  if (!SR) { toast("Reconhecimento de voz só funciona no Chrome ou Edge."); onEnd && onEnd(); return; }
  if (activeRec) { activeRec.stop(); return; }
  const r = new SR();
  r.lang = "es-ES";
  r.interimResults = false;
  r.maxAlternatives = 3;
  r.onresult = (e) => {
    const alts = Array.from(e.results[0]).map((a) => a.transcript);
    onText(alts);
  };
  r.onerror = (e) => {
    if (e.error === "not-allowed") toast("Permita o uso do microfone no navegador.");
    else if (e.error === "no-speech") toast("Não ouvi nada. Tente de novo, mais perto do microfone.");
    else toast("Erro no microfone: " + e.error);
  };
  r.onend = () => { activeRec = null; onEnd && onEnd(); };
  activeRec = r;
  r.start();
}

// Compara palavra por palavra (sem acentos/pontuação) e devolve nota + HTML destacado.
function norm(s) {
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-zñ0-9\s]/g, " ").split(/\s+/).filter(Boolean);
}
function compare(target, said) {
  const a = norm(target), b = norm(said);
  // LCS para descobrir quais palavras do alvo apareceram, na ordem.
  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--)
    for (let j = b.length - 1; j >= 0; j--)
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set();
  let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
    else j++;
  }
  const score = Math.round((hit.size / Math.max(a.length, b.length, 1)) * 100);
  const html = a.map((w, k) => `<span class="${hit.has(k) ? "w-ok" : "w-miss"}">${esc(w)}</span>`).join(" ");
  return { score, html };
}
function bestCompare(target, alts) {
  return alts.map((t) => ({ t, ...compare(target, t) })).sort((x, y) => y.score - x.score)[0];
}

// Gravação da própria voz para comparar com o áudio.
let mediaRec = null;
async function toggleRecord(btn, audioEl) {
  if (mediaRec && mediaRec.state === "recording") { mediaRec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = (e) => chunks.push(e.data);
    mediaRec.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      audioEl.src = URL.createObjectURL(new Blob(chunks, { type: mediaRec.mimeType }));
      audioEl.hidden = false;
      btn.classList.remove("rec");
      btn.textContent = "⏺ Gravar";
      audioEl.play();
    };
    mediaRec.start();
    btn.classList.add("rec");
    btn.textContent = "⏹ Parar";
  } catch (e) {
    toast("Não consegui acessar o microfone.");
  }
}

/* ---------- Repetição espaçada ---------- */
function unlockedCards() { return CARDS.filter((c) => c.w <= S.week); }
function newSeenToday() { return S.newCount[todayKey()] || 0; }
function buildQueue() {
  const now = Date.now();
  const due = [], fresh = [];
  for (const c of unlockedCards()) {
    const st = S.cards[c.id];
    if (!st) fresh.push(c);
    else if (st.due <= now) due.push(c);
  }
  due.sort((x, y) => S.cards[x.id].due - S.cards[y.id].due);
  const room = Math.max(0, S.newPerDay - newSeenToday());
  return due.concat(fresh.slice(0, room));
}
function previewIvl(c, g) {
  const st = S.cards[c.id] || { ivl: 0, ease: 2.5, reps: 0 };
  if (g === 1) return 0;
  if (g === 2) return Math.max(1, Math.round(st.ivl * 1.2));
  if (g === 3) return st.reps === 0 ? 1 : st.reps === 1 ? 3 : Math.round(st.ivl * st.ease);
  return st.reps === 0 ? 4 : Math.round(Math.max(st.ivl, 1) * st.ease * 1.3);
}
function grade(c, g) {
  const isNew = !S.cards[c.id];
  const st = S.cards[c.id] || { due: 0, ivl: 0, ease: 2.5, reps: 0, lapses: 0 };
  if (isNew) S.newCount[todayKey()] = newSeenToday() + 1;
  const ivl = previewIvl(c, g);
  if (g === 1) {
    st.lapses++; st.reps = 0; st.ivl = 0;
    st.ease = Math.max(1.3, st.ease - 0.2);
    st.due = Date.now() + 60 * 1000;   // volta ainda hoje
  } else {
    if (g === 2) st.ease = Math.max(1.3, st.ease - 0.15);
    if (g === 4) st.ease += 0.15;
    st.ivl = ivl; st.reps++;
    st.due = startOfToday() + ivl * DAY + 4 * 3600 * 1000;
  }
  S.cards[c.id] = st;
  save();
  return g === 1;   // true = recolocar na fila
}
function fmtIvl(d) { return d === 0 ? "agora" : d === 1 ? "1 dia" : d < 30 ? d + " dias" : Math.round(d / 30) + " mês"; }

/* ---------- Timer de bloco ---------- */
let timer = null;
let T = { block: null, total: 0, left: 0, running: false };   // sobrevive aos redesenhos da tela
function fmtClock(s) { return (s < 0 ? "+" : "") + pad(Math.floor(Math.abs(s) / 60)) + ":" + pad(Math.abs(s) % 60); }
function timerHTML(blockId, minutes) {
  const done = todayLog().blocks[blockId];
  if (T.block !== blockId) T = { block: blockId, total: minutes * 60, left: minutes * 60, running: false };
  const label = T.running ? "⏸ Pausar" : T.left === T.total ? "▶ Iniciar" : "▶ Continuar";
  return `<div class="timer" id="timer" data-block="${blockId}" data-min="${minutes}">
    <span class="clock" id="clock">${fmtClock(T.left)}</span>
    <button class="btn" id="tStart">${label}</button>
    <span class="spacer"></span>
    <button class="btn ${done ? "" : "ok"}" id="tDone">${done ? "✓ Bloco feito hoje" : "Concluir bloco"}</button>
  </div>`;
}
function bindTimer() {
  const box = $("#timer");
  if (!box) return;
  const block = box.dataset.block;
  const btn = $("#tStart");
  const tick = () => {
    T.left--;
    const clock = $("#clock");
    if (clock) clock.textContent = fmtClock(T.left);
    if (T.left === 0) { toast("Tempo do bloco concluído! 🎉"); speak("¡Muy bien! Tiempo terminado."); }
  };
  clearInterval(timer);
  if (T.running) timer = setInterval(tick, 1000);
  btn.onclick = () => {
    T.running = !T.running;
    btn.textContent = T.running ? "⏸ Pausar" : "▶ Continuar";
    clearInterval(timer);
    if (T.running) timer = setInterval(tick, 1000);
  };
  $("#tDone").onclick = () => {
    const lg = todayLog();
    if (lg.blocks[block]) return;
    const used = Math.round((T.total - T.left) / 60);
    lg.blocks[block] = true;
    lg.minutes += used > 0 ? used : Number(box.dataset.min);
    save();
    clearInterval(timer);
    T = { block: null, total: 0, left: 0, running: false };
    toast("Bloco concluído ✓");
    location.hash = "#hoje";
  };
}

function ring(pct) {
  const r = 36, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="${r}"/>
    <circle class="fg" cx="42" cy="42" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}" transform="rotate(-90 42 42)"/>
    <text x="42" y="49" text-anchor="middle">${Math.round(pct * 100)}%</text></svg>`;
}

/* Cartões */
let queue = [], qIndex = 0, revealed = false, heard = null;

}
function bindRevisar() {
  bindTimer();
  if (!queue.length || qIndex >= queue.length) return;
  const c = queue[qIndex];
  const mic = $("#mic");
  if (mic) mic.onclick = () => {
    mic.classList.add("rec"); mic.textContent = "🎤 Ouvindo...";
    listen((alts) => { heard = bestCompare(c.es, alts); render(); },
      () => { mic.classList.remove("rec"); mic.textContent = "🎤 Falar"; });
  };
  // Ao conferir o que foi digitado/ditado, o cartão já vira.
  bindTyped("typed", c.es, (r) => { heard = r; revealed = true; render(); speak(c.es); });
  const rv = $("#reveal");
  if (rv) rv.onclick = () => { revealed = true; render(); speak(c.es); };
  if (revealed) {
    $("#play").onclick = () => speak(c.es);
    $("#slow").onclick = () => speak(c.es, 0.7);
    document.querySelectorAll("[data-g]").forEach((b) => b.onclick = () => answer(Number(b.dataset.g)));
  }
}
function answer(g) {
  const c = queue[qIndex];
  if (grade(c, g)) queue.push(c);
  qIndex++; revealed = false; heard = null;
  if (qIndex >= queue.length) { queue = []; toast("Fila terminada! 🎉"); }
  render();
}
document.addEventListener("keydown", (e) => {

  else if (revealed && ["1", "2", "3", "4"].includes(e.key)) answer(Number(e.key));
  else if (e.key.toLowerCase() === "m" && $("#mic")) $("#mic").click();
});

    </div>
    ${CAN_MIC ? "" : typedHTML("sTyped")}
    <div id="sResult"></div>
    <div class="row end" style="margin-top:8px">
      <button class="btn ghost" id="sPrev">← Anterior</button>
      <button class="btn" id="sNext">Próxima →</button>
    </div>
  </div>` : `<div class="card empty"><p>Sem frases nesta semana. Use o desafio de fala da lição.</p></div>`}
  <div class="card small">
    <b>Dica:</b> ${CAN_MIC ? "o \"Testar pronúncia\" usa o reconhecimento de voz do navegador" : "dite a frase com o 🎤 do teclado (em Español). O ditado do celular"}. Se ele entendeu sua frase, um espanhol também entenderia. Palavras em vermelho são as que ele não reconheceu: repita só essas.
  </div>`;
}
function bindFalar() {
  bindTimer();
  const list = shadowList(), c = list[shadowIdx];
  if (!c) return;
  $("#sPlay").onclick = () => speak(c.es);
  $("#sSlow").onclick = () => speak(c.es, 0.7);
  bindRecord("sRec", "sAudio");
  const show = (r) => {
    $("#sResult").innerHTML = `<div class="heard">Entendido: <i>"${esc(r.t)}"</i><br>Acerto: <span class="score">${r.score}%</span> · ${r.html}</div>`;
  };
  const mic = $("#sMic");
  if (mic) mic.onclick = () => {
    mic.classList.add("rec"); mic.textContent = "🎤 Ouvindo...";
    listen((alts) => show(bestCompare(c.es, alts)),
      () => { mic.classList.remove("rec"); mic.textContent = "🎤 Testar pronúncia"; });
  };
  bindTyped("sTyped", c.es, show);
  $("#sNext").onclick = () => { shadowIdx = (shadowIdx + 1) % list.length; render(); };
  $("#sPrev").onclick = () => { shadowIdx = (shadowIdx - 1 + list.length) % list.length; render(); };
}

/* Ouvir */
function viewOuvir() {
  const p = phaseOf(S.week);
  return timerHTML("ouvir", 30) + `
  <h1>Ouvir espanhol da Espanha</h1>
  <p class="sub">Escolha um dos recursos abaixo e assista ou ouça por 30 minutos. Regras: <b>sem legenda em português</b>, conteúdo que você entende pelo menos 70%, e no final <b>resuma em voz alta</b> o que entendeu (1 minuto).</p>
  ${INPUT[p.n].map((r) => `
    <a class="card res" href="${r.url}" target="_blank" rel="noopener">
      <b>${esc(r.name)} ↗</b>
      <div class="small">${esc(r.tip)}</div>
    </a>`).join("")}
  <div class="card challenge">
    <h3>Depois de ouvir: resumo falado</h3>
    <p class="small">Grave 1 minuto contando o que você ouviu. É aqui que o input vira fala.</p>
    <div class="row">${recordHTML("oRec", "oAudio", "⏺ Gravar resumo")}</div>
  </div>`;
}
function bindOuvir() {
  bindTimer();
  bindRecord("oRec", "oAudio");
}

/* Escrever */
function currentPrompt() {
  const w = weekData();
  const day = Math.floor(startOfToday() / DAY);
  return w.write[day % w.write.length];
}
function viewEscrever() {
  const w = weekData(), prompt = currentPrompt();
  const draft = (() => { try { return localStorage.getItem(KEY + "-draft") || ""; } catch (e) { return ""; } })();
  const mine = S.journal.slice().reverse().slice(0, 5);
  return timerHTML("escrever", 15) + `
  <h1>Escrever e corrigir</h1>
  <p class="sub">Escreva sem tradutor. Errar aqui é o objetivo: é assim que você descobre o seu portunhol.</p>
  <div class="card">
    <div class="small">Tema de hoje · semana ${S.week}</div>
    <h3>${esc(prompt)}</h3>
    <textarea id="txt" placeholder="Escribe aquí en español...">${esc(draft)}</textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="copy">📋 Copiar para corrigir com o Claude</button>
      <button class="btn" id="saveTxt">💾 Salvar no diário</button>
      <button class="btn ghost" id="readTxt">🔊 Ler meu texto</button>
    </div>
    <p class="small">Copie, cole numa conversa com o Claude e depois <b>leia em voz alta a versão corrigida</b> 3 vezes.</p>
  </div>
  ${mine.length ? `<h2>Últimos textos</h2>` + mine.map((j) => `
    <div class="card"><div class="small">${j.date} · semana ${j.week} · ${esc(j.prompt)}</div>
    <p style="white-space:pre-wrap;margin:8px 0 0">${esc(j.text)}</p></div>`).join("") : ""}`;
}
function bindEscrever() {
  bindTimer();
  const txt = $("#txt");
  txt.oninput = () => { try { localStorage.setItem(KEY + "-draft", txt.value); } catch (e) {} };
  $("#copy").onclick = async () => {
    if (!txt.value.trim()) return toast("Escreva algo primeiro.");
    const w = weekData();
    const msg = `Sou brasileira e estou aprendendo espanhol da Espanha para trabalhar como editora de vídeo lá. Estou na semana ${S.week} de 24 (tema: "${w.title}").
Corrija o meu texto abaixo:
1) Mostre a versão corrigida, natural, como um espanhol diria.
2) Liste cada erro com uma explicação curta, marcando os que são "portunhol" (influência do português).
3) Me dê 3 frases novas parecidas para eu praticar falando.

Tema: ${currentPrompt()}
Meu texto:
${txt.value.trim()}`;
    try { await navigator.clipboard.writeText(msg); toast("Copiado! Cole numa conversa com o Claude."); }
    catch (e) { txt.select(); toast("Não consegui copiar automaticamente. Use Ctrl+C."); }
  };
  $("#saveTxt").onclick = () => {
    if (!txt.value.trim()) return toast("Escreva algo primeiro.");
    S.journal.push({ date: todayKey(), week: S.week, prompt: currentPrompt(), text: txt.value.trim() });
    save();
    try { localStorage.removeItem(KEY + "-draft"); } catch (e) {}
    toast("Salvo no diário ✓");
    render();
  };
  $("#readTxt").onclick = () => txt.value.trim() && speak(txt.value);
}

/* Trilha */
function viewTrilha() {
  return `<h1>Trilha de 6 meses</h1>
  <p class="sub">24 semanas, uma por vez. Avance quando a semana estiver confortável (o ideal é 7 dias em cada).</p>
  <div class="card">
    <div class="row"><b>Semana ${S.week}: ${esc(weekData().title)}</b><span class="spacer"></span>
      ${S.week < 24 ? `<button class="btn primary" id="nextWeek">Concluir semana e avançar →</button>` : `<span class="tag new">Última semana!</span>`}</div>
    <div class="small" style="margin-top:6px">Ao avançar, as frases da próxima semana entram nos seus cartões.</div>
  </div>
  ${PHASES.map((p) => `
    <div class="phase-title"><h2 style="margin:0">Fase ${p.n}: ${p.name}</h2><span>sem. ${p.weeks[0]}–${p.weeks[1]}</span></div>
    ${WEEKS.filter((w) => w.n >= p.weeks[0] && w.n <= p.weeks[1]).map((w) => {
      const cls = w.n === S.week ? "current" : w.n < S.week ? "done" : "locked";
      return `<div class="card week ${cls}" data-week="${w.n}">
        <div class="num">${w.n < S.week ? "✓" : w.n}</div>
        <div style="flex:1"><b>${esc(w.title)}</b><div class="small">${CARDS.filter((c) => c.w === w.n).length} frases</div></div>
        <span class="small">${w.n <= S.week ? "Ver lição →" : "🔒 prévia"}</span>
      </div>`;
    }).join("")}`).join("")}`;
}
function bindTrilha() {
  const nb = $("#nextWeek");
  if (nb) nb.onclick = () => confirmClick(nb, `Toque de novo para ir à semana ${S.week + 1}`, () => {
    S.weeksDone[S.week] = todayKey();
    S.week++;
    save();
    toast(`Semana ${S.week} liberada! 🎉`);
    render();
  });
  document.querySelectorAll("[data-week]").forEach((el) => el.onclick = () => {
    lessonWeek = Number(el.dataset.week);
    location.hash = "#licao";
  });
}

/* Progresso */
function streak() {
  let n = 0;
  const d = new Date();
  if (!(S.log[todayKey(d)] && S.log[todayKey(d)].minutes > 0)) d.setDate(d.getDate() - 1);
  while (S.log[todayKey(d)] && S.log[todayKey(d)].minutes > 0) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function viewProgresso() {
  const logs = Object.values(S.log);
  const minutes = logs.reduce((a, l) => a + (l.minutes || 0), 0);
  const days = logs.filter((l) => l.minutes > 0).length;
  const seen = Object.keys(S.cards).length;
  const mastered = Object.values(S.cards).filter((c) => c.ivl >= 21).length;
  const listenMin = logs.filter((l) => l.blocks && l.blocks.ouvir).length * 30;
  const cells = [];
  for (let i = 27; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const m = (S.log[todayKey(d)] || {}).minutes || 0;
    cells.push(`<div class="${m >= 75 ? "l3" : m >= 30 ? "l2" : m > 0 ? "l1" : ""}" title="${todayKey(d)}: ${m} min"></div>`);
  }
  return `<h1>Seu progresso</h1>
  <p class="sub">Começou em ${new Date(S.startDate + "T00:00:00").toLocaleDateString("pt-BR")}.</p>
  <div class="card">
    <div class="row small"><span>Trilha: semana ${S.week} de 24</span><span class="spacer"></span><span>${Math.round((S.week - 1) / 24 * 100)}%</span></div>
    <div class="bar" style="margin-top:6px"><div style="width:${(S.week - 1) / 24 * 100}%"></div></div>
  </div>
  <div class="stats">
    <div class="card stat"><div class="v">${streak()} 🔥</div><div class="l">dias seguidos</div></div>
    <div class="card stat"><div class="v">${(minutes / 60).toFixed(1)}h</div><div class="l">de estudo total</div></div>
    <div class="card stat"><div class="v">${days}</div><div class="l">dias estudados</div></div>
    <div class="card stat"><div class="v">${(listenMin / 60).toFixed(1)}h</div><div class="l">ouvindo espanhol</div></div>
    <div class="card stat"><div class="v">${seen}</div><div class="l">frases praticadas</div></div>
    <div class="card stat"><div class="v">${mastered}</div><div class="l">frases dominadas</div></div>
  </div>
  <h2>Últimas 4 semanas</h2>
  <div class="card"><div class="heat">${cells.join("")}</div>
  <div class="small" style="margin-top:8px">Cada quadrado é um dia. Verde mais escuro = mais minutos.</div></div>
  <h2>Diário de textos</h2>
  <div class="card small">${S.journal.length} texto(s) escritos. Veja e escreva novos em <a href="#escrever">Escrever</a>.</div>`;
}

/* Configurações */
function viewConfig() {
  return `<h1>Configurações</h1>
  <div class="card">
    <label>Data de início</label><input type="date" id="cStart" value="${S.startDate}">
    <div style="height:12px"></div>
    <label>Cartões novos por dia</label><input type="number" id="cNew" min="3" max="30" value="${S.newPerDay}">
    <div style="height:12px"></div>
    <label>Semana atual</label>
    <select id="cWeek">${WEEKS.map((w) => `<option value="${w.n}" ${w.n === S.week ? "selected" : ""}>Semana ${w.n}: ${esc(w.title)}</option>`).join("")}</select>
    <div class="row end" style="margin-top:14px"><button class="btn primary" id="cSave">Salvar</button></div>
  </div>
  <div class="card">
    <h3>Voz</h3>
    <p class="small">Voz em uso: <b>${esVoice ? esc(esVoice.name) : "nenhuma voz em espanhol encontrada"}</b>.
    ${esVoice && !/es-es/i.test(esVoice.lang) ? "<br>Essa voz não é da Espanha. Instale uma voz 'Español (España)' nas configurações de Fala do Windows." : ""}
    No Edge, as vozes "Online (Natural)" soam muito mais naturais.</p>
    <button class="btn" onclick="speak('Hola, ¿qué tal? Vamos a aprender español juntas.')">🔊 Testar voz</button>
  </div>
  <div class="card">
    <h3>Onde fica o seu progresso</h3>
    <p class="small">${cloud
      ? "✓ Sincronizado com a sua conta do Claude. Abra este mesmo link no celular ou no computador e continue de onde parou."
      : EMBED ? "Salvo só neste aparelho (não consegui conectar à sua conta agora)."
      : "Salvo só neste navegador. Baixe um backup de vez em quando."}</p>
    <div class="row">
      ${EMBED ? "" : `<button class="btn" id="cExport">⬇ Baixar backup</button>
      <label class="btn" style="margin:0">⬆ Restaurar backup<input type="file" id="cImport" accept=".json" hidden></label>`}
      <span class="spacer"></span>
      <button class="btn ghost" id="cReset" style="color:var(--accent)">Apagar tudo</button>
    </div>
  </div>`;
}
function bindConfig() {
  $("#cSave").onclick = () => {
    S.startDate = $("#cStart").value || S.startDate;
    S.newPerDay = Math.min(30, Math.max(3, Number($("#cNew").value) || 10));
    S.week = Number($("#cWeek").value);
    save(); toast("Salvo ✓"); render();
  };
  if ($("#cExport")) $("#cExport").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
    a.download = `espanol-backup-${todayKey()}.json`;
    a.click();
  };
  if ($("#cImport")) $("#cImport").onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    f.text().then((t) => {
      try { S = Object.assign(defaultState(), JSON.parse(t)); save(); toast("Backup restaurado ✓"); render(); }
      catch (err) { toast("Arquivo inválido."); }
    });
  };
  const rs = $("#cReset");
  rs.onclick = () => confirmClick(rs, "Toque de novo para apagar TUDO", () => {
    S = defaultState(); save(); toast("Progresso apagado."); location.hash = "#hoje"; render();
  });
}

/* ---------- Roteador ---------- */
const VIEWS = {
  hoje: [viewHoje, () => {}],
  revisar: [viewRevisar, bindRevisar],
  licao: [viewLicao, bindLicao],
  falar: [viewFalar, bindFalar],
  ouvir: [viewOuvir, bindOuvir],
  escrever: [viewEscrever, bindEscrever],
  trilha: [viewTrilha, bindTrilha],
  progresso: [viewProgresso, () => {}],
  config: [viewConfig, bindConfig],
};
function route() { const r = location.hash.slice(1); return VIEWS[r] ? r : "hoje"; }
function render() {
  const r = route();
  const [view, bind] = VIEWS[r];
  $("#app").innerHTML = view();
  bind();
  document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("active", a.getAttribute("href") === "#" + r));
}
let lastRoute = null;
window.addEventListener("hashchange", () => {
  const r = route();
  if (r !== lastRoute) {
    clearInterval(timer);
    T.running = false;
    if (activeRec) activeRec.stop();
    if (window.speechSynthesis) speechSynthesis.cancel();
    if (r !== "licao") lessonWeek = null;
    if (r === "revisar") startReview();
    window.scrollTo(0, 0);
  }
  lastRoute = r;
  render();
});
lastRoute = route();
render();
initCloud();

</script>
</body>
</html>
